name: NBA 30-Min Pre-Game Alerts

on:
  schedule:
    # Run at :10 and :35 of every hour during NBA hours (18:00 - 05:00 UTC = 01:00 - 12:00 Thai Time)
    - cron: '10,35 18-23 * * *'
    - cron: '10,35 0-5 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Web UI

permissions:
  contents: write

jobs:
  pre-game-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 30-Min Pre-Game Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          python run_alerts.py

      - name: Commit & Push Alert State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/raw/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: record alerted games ledger [skip ci]" && git push)
